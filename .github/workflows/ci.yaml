name: TJAP CI Pipeline

on:
  push:
    branches: [main, qa, dev]
  pull_request:
    branches: [main, qa]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-verify:
    name: Codebase Verification & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Verification (ESLint + Strict TSC)
        run: npm run verify

  build-test:
    name: Next.js Production Build Validation
    needs: audit-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Next.js Build
        env:
          NODE_ENV: production
          USE_STORYBLOK_FIXTURES: 'true'
        run: npx next build --no-lint